<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one 1080×1920 reel stage; SVG garage world (front + over-the-shoulder shots) under HTML captions */
:root{
  --ink:#06100c; --app:#0b1512; --fg:#f3f6f4; --muted:#9fb0a9;
  --green:#3ecf86; --red:#ff7474; --amber:#ffc44d; --plate:#000000d9;
  --display:"Inter Tight","Inter Display","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
body.render{padding:0;display:block}
#wrap{position:relative;width:min(100%,calc((100vh - 90px) * 0.5625));aspect-ratio:9/16;max-width:100%}
body.render #wrap{width:1080px;height:1920px}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--app)}
.abs{position:absolute}
#appbg{inset:0;background:radial-gradient(700px 600px at 15% 10%,#1f6b4a66,transparent 70%),radial-gradient(700px 700px at 90% 90%,#1d3f6e55,transparent 70%),linear-gradient(#09110e,#030605)}
#sv{position:absolute;left:0;top:0;width:1080px;height:1920px}
#fog{inset:0;background:radial-gradient(circle at 50% 40%,#d9d4cacc,#9c968bcc);opacity:0;mix-blend-mode:screen}
#top{left:60px;right:60px;top:150px;text-align:center;font-weight:900;font-size:84px;line-height:1.08;letter-spacing:-.02em;text-wrap:balance;text-shadow:0 4px 0 #000,0 0 24px #000a}
#cap{left:90px;right:90px;top:1600px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px}
.w{background:var(--plate);border-radius:18px;padding:8px 18px 12px;font-weight:800;font-size:64px;line-height:1.05;letter-spacing:-.01em}
.w.hl{color:var(--amber)} .w.red{color:var(--red)} .w.grn{color:var(--green)}
.push{left:70px;width:940px;height:132px;border-radius:34px;background:#1b2421f2;border:2px solid #ffffff17;display:flex;align-items:center;gap:26px;padding:0 34px;box-shadow:0 20px 50px #0009}
.push .ic{width:76px;height:76px;border-radius:20px;background:#2a3431;display:grid;place-items:center;font-size:44px}
.push .t{flex:1;font-size:40px;font-weight:600;color:var(--fg)}
.push .t small{display:block;font-size:30px;color:var(--muted);font-weight:500}
.push .s{font-size:48px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
#rew{left:60px;top:80px;font-weight:800;font-size:46px;color:#fff;background:#d23b3bdd;border-radius:14px;padding:8px 20px}
#scan{inset:0;background:repeating-linear-gradient(#ffffff0c 0 2px,transparent 2px 6px);mix-blend-mode:overlay}
#kub{width:230px;height:230px}
#kub svg{overflow:visible;filter:drop-shadow(0 14px 30px #000a)}
.bub{background:#f6fbf8;color:#0a1410;font-weight:800;font-size:58px;line-height:1.1;border-radius:40px;padding:26px 36px;max-width:760px;box-shadow:0 18px 50px #0008;text-wrap:balance}
.bub b{color:#1a9c5c}
.bub.mih{background:#fff3d6}
#phone{left:40px;top:300px;width:1000px;border-radius:40px;overflow:hidden;box-shadow:0 40px 90px #000c}
#phone img{width:1000px;display:block}
#ring{border:8px solid var(--green);border-radius:34px;box-shadow:0 0 0 9999px #00000088,0 0 40px #3ecf86}
.chip{left:50%;font-weight:700;font-size:52px;border-radius:999px;padding:16px 38px;white-space:nowrap;background:#10261c;border:3px solid #3ecf86aa;color:var(--green);box-shadow:0 0 40px #3ecf8640}
.chip.blu{background:#132033;border-color:#6aa6ff99;color:#a9ccff}
#end{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center;background:radial-gradient(700px 600px at 50% 35%,#1f6b4a55,transparent 70%),linear-gradient(#09110e,#030605)}
#end img{width:320px;height:320px;border-radius:74px;box-shadow:0 0 0 8px #3ecf86,0 30px 80px #000c}
#end h1{margin:0;font-size:120px;font-weight:900;letter-spacing:-.03em}
#end p{margin:0;font-size:58px;font-weight:700;color:var(--fg)}
#end .cta{font-size:62px;font-weight:800;background:var(--green);color:#062014;border-radius:999px;padding:24px 56px}
#end .sub{font-size:48px;font-weight:600;color:var(--green)}
#bar{left:0;top:0;height:10px;background:var(--green)}
#flash{inset:0;background:#fff;opacity:0}
#ctrl{display:flex;gap:12px;align-items:center;width:min(100%,560px)}
#ctrl button{font:600 15px var(--display);background:var(--green);color:#062014;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
#ctrl button:focus-visible,#ctrl input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#ctrl input{flex:1;accent-color:var(--green)}
#ctrl span{font:500 14px var(--display);color:var(--muted);font-variant-numeric:tabular-nums;min-width:54px}
body.render #ctrl{display:none}
</style>

const CAPS=[[0.25,2.6,'Хватит или *нет?*','red'],[2.9,5.6,TEA?'Ну семечки, ну огурчики, ну *по мелочи*':'Ну бутылочка, ну сиги, ну *по мелочи*'],[5.6,7.6,'А сколько осталось, *непонятно*','red'],
  [8.55,9.6,'как *в тумане*'],[15.6,18.9,'Каждый день знаешь, сколько *можно сегодня*','grn']];
const TOPS=[[0.0,2.6,'Я, когда до получки 5 дней'],[7.9,9.6,'Жизнь без плана']];
const PUSH=TEA?[['🛒','Магазин у дома','Чипсы и семечки','−410 ₽',3.0],['🥒','Огурцы малосольные','Рынок','−320 ₽',3.65],['🛒','Магазин у дома','Еще по мелочи','−560 ₽',4.3],['🥒','Огурцы малосольные','Рынок, еще банка','−320 ₽',4.95],['🛒','Магазин у дома','Ну очень нужно','−780 ₽',5.6]]
 :[['🍾','Бутылочка','Магазин у дома','−690 ₽',3.0],['🚬','Сиги','Ларек','−250 ₽',3.65],['🥒','Огурцы малосольные','Рынок','−320 ₽',4.3],['🍾','Еще бутылочка','Магазин у дома','−690 ₽',4.95],['🚬','Сиги','Ларек','−250 ₽',5.6]];
const CHIPS=[[16.6,'До получки хватает','',1290],[17.3,'≈4 800 ₽ в день','blu',1400]];
const pushes=$('pushes'), chips=$('chips');
PUSH.forEach(p=>{const d=document.createElement('div');d.className='abs push';d.innerHTML=`<div class="ic">${p[0]}</div><div class="t">${p[1]}<small>${p[2]}</small></div><div class="s">${p[3]}</div>`;pushes.appendChild(d)});
CHIPS.forEach(c=>{const d=document.createElement('div');d.className='abs chip '+c[2];d.textContent=c[1];d.style.top=c[3]+'px';chips.appendChild(d)});

function render(t){
  const front=$('front'),bk=$('back');
  const inFront=t<10.1||(t>=19&&t<23)||t>=26.6, inBack=t>=9.6&&t<13.6, inApp=t>=13.2&&t<19.4, inEnd=t>=22.9;
  // camera for front shot
  let s=1,cx=540,cy=820,dx=0,rot=0,filt='';
  if(t<2.6){s=1.06+0.06*seg(t,0,2.6)}
  else if(t<7.6){s=1.02;filt='sepia(.6) saturate(1.25) brightness(1.05)'}
  else if(t<9.6){s=1.04+0.14*eio(seg(t,7.6,9.0));cy=lerp(820,700,seg(t,7.6,9.0))}
  else if(t<10.1){const k=eio(seg(t,9.6,10.1));s=1.18+0.3*k;dx=-1500*k;rot=-8*k;cy=700}
  else {s=1.0+0.05*seg(t,19,23)}
  front.setAttribute('transform',`translate(${540+dx} ${cy}) rotate(${rot}) scale(${s}) translate(${-540} ${-cy})`);
  front.style.display=inFront?'':'none';
  if(inFront)drawFront(t);
  // back shot: whip in, then zoom into the phone screen
  if(inBack){const w=eio(seg(t,9.6,10.1)),k=eio(seg(t,10.15,12.6));
    const z=lerp(1,3.15,k),px=lerp(540,700,k),py=lerp(960,800,k);
    bk.setAttribute('transform',`translate(${540+1500*(1-w)} 960) rotate(${8*(1-w)+5*k}) scale(${z}) translate(${-px} ${-py})`);
    bk.style.display='';bk.setAttribute('opacity',1-seg(t,13.2,13.6));drawBack(t,z)} else bk.style.display='none';
  const whip=t>9.6&&t<10.15?Math.sin(Math.PI*seg(t,9.6,10.15))*14:0;
  sv.style.filter=(filt+(whip?` blur(${whip}px)`:'')).trim()||'none';
  show(sv,inEnd&&t<26.6?1-seg(t,22.9,23.3):1);
  if(t>=26.6)show(sv,seg(t,26.6,27));
  // fog from the big exhale
  show($('fog'),TEA?0.35*inout(t,8.6,9.7,.4,.2):0.55*inout(t,8.8,9.9,.5,.3));
  // rewind markers
  const rw=t>=2.6&&t<7.6; show($('rew'),rw?(Math.floor(t*2.5)%2?1:0.75):0); show($('scan'),rw?1:0);
  // flash on whip
  $('flash').style.opacity=0.35*(1-seg(t,22.9,23.2))*(t>=22.9?1:0);
  // top + captions
  const tp=TOPS.find(x=>t>=x[0]&&t<x[1]),top=$('top');
  if(tp){top.textContent=tp[2];const k=back(seg(t,tp[0],tp[0]+0.3));show(top,inout(t,tp[0],tp[1],.15,.2));top.style.transform=`scale(${0.7+0.3*k})`}else show(top,0);
  const cp=CAPS.find(x=>t>=x[0]&&t<x[1]),cap=$('cap');
  if(cp){words(cap,cp[2],cp[0],t,cp[3]||'hl');show(cap,1-seg(t,cp[1]-0.15,cp[1]))}else show(cap,0);
  // pushes
  [...pushes.children].forEach((d,i)=>{const t0=PUSH[i][4];const k=eout(seg(t,t0,t0+0.3));const n=PUSH.filter(p=>p[4]<=t).length;const y=170+(n-1-i)*148;
    d.style.top=y+'px';d.style.transform=`translateY(${-160*(1-k)}px) scale(${0.9+0.1*k})`;const age=n-1-i;show(d,t>=t0&&t<7.6&&age<3?k*(1-seg(t,7.35,7.6))*(age<2?1:0.6):0)});
  // Kubysh bubbles
  const kub=$('kub'),bK=$('bubK'),bM=$('bubM');
  let kt='',kt0=0,pos=null;
  if(t>=11.0&&t<13.5){kt0=t<12.2?11.0:12.2;kt=t<12.2?'Я Кубыш, приложение на айфон':'Считаю, <b>хватит ли до получки</b>';pos={bl:'60px',bt:'1270px',org:'50% 0%'}}
  else if(t>=13.6&&t<15.4){kt0=13.6;kt='Смотри';pos={bl:'330px',bt:'1640px',org:'0% 50%'};kub.style.left='70px';kub.style.top='1600px';
    const a=back(seg(t,13.6,13.95));kub.style.transform=`scale(${a}) rotate(${Math.sin(t*6)*3}deg)`;show(kub,1)}
  else if(t>=21.0&&t<22.9){kt0=21.0;kt='Это <b>я</b> разбираюсь';pos={bl:'auto',br:'60px',bt:'880px',org:'80% 100%'}}
  if(!(t>=13.6&&t<15.4))show(kub,0);
  if(kt){if(bK.innerHTML!==kt)bK.innerHTML=kt;const a=back(seg(t,kt0+0.05,kt0+0.35));bK.style.left=pos.bl;bK.style.right=pos.br||'auto';bK.style.top=pos.bt;bK.style.transformOrigin=pos.org;
    bK.style.transform=`scale(${a})`;show(bK,cl(a*2))}else show(bK,0);
  if(t>=19.2&&t<22.9){const txt='Я, кстати, в финансах разбираюсь';if(bM.textContent!==txt)bM.textContent=txt;const a=back(seg(t,19.2,19.5));bM.style.left='60px';bM.style.top='380px';bM.style.transformOrigin='30% 100%';bM.style.transform=`scale(${a})`;show(bM,cl(a*2)*(t<21?1:0.55))}else show(bM,0);
  // app scene
  const ph=$('phone'),ring=$('ring');
  if(inApp){const k=eout(seg(t,13.3,13.9));const z=eout(seg(t,14.9,15.6));
    const s2=1+0.15*z, f0=0.893*s2, ox=((1080-889*f0)/2-40-113*f0)*z, oy=(520-300-663*f0)*z;
    ph.style.transform=`translate(${ox}px,${900*(1-k)+oy}px) scale(${s2})`;ph.style.transformOrigin='0 0';show(ph,1);
    const L=40+ox+113*f0,T=300+oy+663*f0;ring.style.left=L+'px';ring.style.top=T+'px';ring.style.width=(889*f0)+'px';ring.style.height=(447*f0)+'px';show(ring,seg(t,15.4,15.8)*(1-seg(t,18.9,19.2)));
  }else{show(ph,0);show(ring,0)}
  [...chips.children].forEach((d,i)=>{const t0=CHIPS[i][0];const k=back(seg(t,t0,t0+0.35));d.style.transform=`translateX(-50%) scale(${k})`;show(d,t>=t0&&t<19.0?cl(k*2):0)});
  // end card
  const e=$('end');show(e,inEnd?eout(seg(t,22.9,23.3))*(1-seg(t,26.6,27)):0);
  [...e.children].forEach((c,i)=>{const k=back(seg(t,23.0+i*0.25,23.35+i*0.25));c.style.transform=`translateY(${40*(1-k)}px) scale(${0.85+0.15*k})`;c.style.opacity=cl(k*1.5)});
  $('bar').style.width=(1080*t/D)+'px';
}
window.render=render; window.DUR=D;

const RENDER=location.hash.includes('render'); if(RENDER)document.body.classList.add('render');
function fit(){const w=$('wrap').clientWidth;$('stage').style.transform=`scale(${RENDER?1:w/1080})`}
addEventListener('resize',fit);fit();
let playing=!RENDER&&!matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now(),cur=0;
const seek=$('seek'),tc=$('tc'),btn=$('play');
btn.textContent=playing?'Пауза':'Смотреть';
btn.onclick=()=>{playing=!playing;btn.textContent=playing?'Пауза':'Смотреть';t0=performance.now()-cur*1000};
seek.oninput=()=>{cur=+seek.value;t0=performance.now()-cur*1000;render(cur);tc.textContent=cur.toFixed(1)+' с'};
render(RENDER?0:1.0);
function loop(){if(playing){cur=((performance.now()-t0)/1000)%D;render(cur);seek.value=cur;tc.textContent=cur.toFixed(1)+' с'}requestAnimationFrame(loop)}
if(!RENDER)requestAnimationFrame(loop);
</script>
