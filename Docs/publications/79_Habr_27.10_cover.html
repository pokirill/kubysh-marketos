<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1560px;height:880px;background:#0f0d17;font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:#ece9f5;overflow:hidden;position:relative}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#8d5cff33 0,transparent 65%);right:-250px;top:-300px}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:65px 65px}
.left{position:absolute;left:80px;top:190px;width:360px}
.eng{height:62px;border:2px solid #ffffff2a;border-radius:14px;margin-bottom:20px;display:flex;align-items:center;padding:0 22px;font-size:26px;color:#b9b3cc;background:#ffffff06;font-family:"JetBrains Mono",Menlo,monospace}
.eng s{color:#ff6b81;text-decoration-thickness:3px}
.ssot{position:absolute;left:560px;top:385px;width:190px;height:190px;border-radius:28px;background:#8d5cff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:700;color:#fff;box-shadow:0 0 80px #8d5cff88;line-height:1.15}
svg{position:absolute;inset:0}
.lane{position:absolute;left:880px;width:600px}
.lbl{font-size:25px;color:#cfc9e3;margin-top:16px;display:flex;align-items:center;gap:14px}
.pr{width:38px;height:38px;border-radius:10px;background:#ffffff14;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:22px}
.track{height:18px;border-radius:9px;background:#ffffff12;position:relative}
.bar{position:absolute;left:0;top:0;height:18px;border-radius:9px;background:linear-gradient(90deg,#8d5cff,#b89bff)}
.flag{position:absolute;top:-58px;transform:translateX(-50%);font-family:"JetBrains Mono",Menlo,monospace;font-size:24px;padding:6px 12px;border-radius:8px;background:#1d1830;border:2px solid #8d5cff;white-space:nowrap}
.flag.bad{border:2px dashed #ff6b81;color:#ff9aa9;background:#2a1520}
.flag.bad s{text-decoration-thickness:3px}
.tick{position:absolute;top:-14px;width:3px;height:46px;background:#8d5cff;transform:translateX(-50%)}
.tick.bad{background:#ff6b81}
.today{position:absolute;left:880px;top:200px;height:600px;border-left:2px dashed #ffffff40}
.today span{position:absolute;top:-38px;left:-30px;font-size:20px;color:#8f89a6}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="left">
 <div class="eng">engine_1</div>
 <div class="eng">engine_2</div>
 <div class="eng">engine_3</div>
 <div class="eng">engine_4</div>
 <div class="eng">engine_5</div>
</div>
<svg width="1560" height="880">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#8d5cff"/></marker></defs>
 <g stroke="#8d5cff" stroke-width="3" fill="none" opacity=".75">
  <path d="M440,221 C510,181 500,400 556,420" marker-end="url(#a)"/>
  <path d="M440,303 C510,263 500,420 556,432"/>
  <path d="M440,385 C500,345 520,440 556,440"/>
  <path d="M440,467 C510,427 520,452 556,448"/>
  <path d="M440,549 C510,509 500,470 556,460" marker-end="url(#a)"/>
  <path d="M752,480 C800,480 820,480 868,480" marker-end="url(#a)"/>
 </g>
</svg>
<div class="ssot">1 источник<br>правды</div>
<div class="today"><span>сегодня</span></div>
<div class="lane" style="top:300px"><div class="track"><div class="bar" style="width:34%"></div><div class="tick" style="left:34%"></div><div class="tick bad" style="left:76%"></div><div class="flag" style="left:34%">12.12.2026</div><div class="flag bad" style="left:76%">12.04.2027 ?</div></div><div class="lbl"><div class="pr">1</div>Подушка</div></div>
<div class="lane" style="top:490px"><div class="track"><div class="bar" style="width:52%"></div><div class="tick" style="left:52%"></div><div class="flag" style="left:52%">03.2027</div></div><div class="lbl"><div class="pr">2</div>Отпуск</div></div>
<div class="lane" style="top:680px"><div class="track"><div class="bar" style="width:72%"></div><div class="tick" style="left:72%"></div><div class="flag" style="left:72%">08.2027</div></div><div class="lbl"><div class="pr">3</div>iPhone</div></div>
</body></html>
